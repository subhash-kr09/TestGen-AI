services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testgen}
      MYSQL_USER: ${MYSQL_USER:-testgen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testgen}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  analysis-service:
    build: ../analysis-service
    ports: ["8000:8000"]
    volumes: ["project_workspace:/workspace"]

  execution-worker:
    build: ../execution-worker
    ports: ["8001:8001"]
    volumes: ["project_workspace:/workspace"]
    environment:
      WORKSPACE: /workspace

  backend:
    build: ../backend
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/testgen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${MYSQL_USER:-testgen}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testgen}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-development-secret-change-me}
      ANALYSIS_URL: http://analysis-service:8000
      EXECUTION_URL: http://execution-worker:8001
    depends_on:
      mysql: {condition: service_healthy}
      analysis-service: {condition: service_started}
      execution-worker: {condition: service_started}
    volumes: ["project_workspace:/workspace"]

  frontend:
    build: ../frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mysql_data:
  project_workspace:
