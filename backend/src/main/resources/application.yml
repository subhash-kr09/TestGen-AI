spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/testgen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:testgen}
    password: ${DB_PASSWORD:testgen}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
server:
  port: 8080
app:
  jwt-secret: ${JWT_SECRET:development-secret-change-me-development-secret-change-me}
  analysis-url: ${ANALYSIS_URL:http://localhost:8000}
  execution-url: ${EXECUTION_URL:http://localhost:8001}
